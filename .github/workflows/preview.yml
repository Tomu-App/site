name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-pr-${{ github.event.number }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  GH_TOKEN: ${{ github.token }}
  PREVIEW_NAME: pr-${{ github.event.number }}

jobs:
  preview:
    # Same-repo PRs only: fork PRs get no secrets and only run CI.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@lts
          cache: true
          require-lockfile: true
      # No REQUIRE_PROD_CONFIG: Previews build with the Turnstile test site key.
      - run: pnpm build
      - name: Apply D1 migrations (shared Preview database)
        run: pnpm exec wrangler d1 migrations apply PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc
      - name: Deploy Preview
        run: |
          pnpm exec wrangler preview --name "$PREVIEW_NAME" --json \
            --message "PR #${{ github.event.number }} ${{ github.event.pull_request.head.sha }}" > preview.out
          # stdout may carry log lines before the JSON object.
          sed -n '/^{/,$p' preview.out > preview.json
          URL=$(jq -r '(.deployment.urls // .preview.urls // [])[0] // empty' preview.json)
          if [ -z "$URL" ]; then
            echo "No Preview URL in wrangler output" >&2
            exit 1
          fi
          echo "PREVIEW_URL=$URL" >> "$GITHUB_ENV"
      - name: Comment Preview URL on the PR
        run: |
          MARKER='<!-- tomu-site-preview -->'
          BODY="$MARKER
          Preview: $PREVIEW_URL
          Commit: ${{ github.event.pull_request.head.sha }}"
          ID=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$MARKER\")))][0].id // empty")
          if [ -n "$ID" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$ID" -f body="$BODY"
          else
            gh pr comment ${{ github.event.number }} --repo "${{ github.repository }}" --body "$BODY"
          fi

  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@lts
          cache: true
          require-lockfile: true
      - name: Delete Preview
        run: pnpm exec wrangler preview delete --name "$PREVIEW_NAME" --skip-confirmation
