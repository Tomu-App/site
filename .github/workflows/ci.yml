name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@lts
          cache: true
          require-lockfile: true
      - run: pnpm build
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
